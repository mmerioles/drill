# docker compose up -d, then open http://<this machine>:8080
services:
  tetodoro:
    image: ghcr.io/mmerioles/tetodoro:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Every device (browser or mac app) uses this to sync. Pick something long.
      TETODORO_TOKEN: ${TETODORO_TOKEN:?set TETODORO_TOKEN, e.g. in a .env file next to this one}
    volumes:
      - tetodoro-data:/data

volumes:
  tetodoro-data:
