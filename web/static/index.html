<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>drill</title>
  <meta name="description" content="a quiet pomodoro timer.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F0ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon-maskable-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <span class="spacer"></span>
      <button class="link" id="sync" type="button" hidden>sync</button>
      <button class="link" id="open-inspo" type="button">inspo</button>
      <button class="link" id="open-settings" type="button">settings</button>
    </header>

    <section class="timer" aria-label="timer">
      <div class="face">
        <svg class="ring" id="ring" viewBox="0 0 270 270" aria-hidden="true">
          <path class="track"/><path class="arc"/><circle class="tip" r="3.1"/>
        </svg>
        <div class="readout">
          <p class="status" id="status">&nbsp;</p>
          <p class="clock" id="clock" role="timer" aria-live="off" aria-label="focus, 25 minutes left">25:00</p>
          <div class="under">
            <div class="dots" id="dots" aria-hidden="true"></div>
            <div class="mark" id="mark" hidden>
              <svg id="glyph" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"></svg>
              <p class="round" id="round"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="tag" id="tag-box">
        <label class="tag-field">
          <span>studying</span>
          <input id="tag" type="text" placeholder="anything" autocomplete="off" spellcheck="false" maxlength="40">
        </label>
        <div class="suggest" id="suggest"></div>
      </div>

      <div class="controls">
        <button class="link" id="reset" type="button">reset</button>
        <button class="capsule" id="toggle" type="button">start</button>
        <button class="link" id="skip" type="button">skip</button>
      </div>
    </section>

    <section class="year" aria-label="your year">
      <div class="year-head">
        <div class="filter" id="filter"></div>
      </div>
      <svg class="grid" id="grid" role="img" aria-label="your year"></svg>
      <div class="caption" id="caption"></div>
    </section>
  </main>

  <!-- First launch and after signing out. The account dialog's form is
       moved in here while it shows. -->
  <section class="welcome" id="welcome" aria-label="welcome" hidden>
    <div class="welcome-body">
      <h1>drill</h1>
      <p class="tagline">a quiet pomodoro timer</p>
      <div class="account" id="welcome-form"></div>
      <button class="link" id="continue-offline" type="button">continue offline</button>
    </div>
  </section>

  <dialog class="settings" id="settings">
    <form method="dialog">
      <div class="group">
        <div class="row">
          <span>appearance</span>
          <div class="segmented" id="theme" role="radiogroup" aria-label="appearance">
            <button type="button" role="radio" value="light">light</button>
            <button type="button" role="radio" value="dark">dark</button>
          </div>
        </div>
      </div>
      <div class="group">
        <label class="row"><span>focus</span><span class="num"><input type="number" id="focus" min="5" max="120" step="5"> min</span></label>
        <label class="row"><span>short break</span><span class="num"><input type="number" id="shortBreak" min="1" max="30"> min</span></label>
        <label class="row"><span>long break</span><span class="num"><input type="number" id="longBreak" min="5" max="60" step="5"> min</span></label>
        <label class="row"><span>long break every</span><span class="num"><input type="number" id="longBreakEvery" min="2" max="8"></span></label>
      </div>
      <div class="group">
        <p class="row note">intervals</p>
        <label class="row"><span>run</span><span class="num"><input type="number" id="run" min="1" max="60"> min</span></label>
        <label class="row"><span>walk</span><span class="num"><input type="number" id="walk" min="1" max="60"> min</span></label>
      </div>
      <div class="group">
        <label class="row"><span>auto-start breaks</span><input type="checkbox" class="switch" id="autoStartBreaks"></label>
        <label class="row"><span>auto-start focus</span><input type="checkbox" class="switch" id="autoStartFocus"></label>
        <label class="row"><span>sound</span><input type="checkbox" class="switch" id="sound"></label>
      </div>
      <div class="group sync-group">
        <div class="row"><span id="account-line">sync</span><button class="link" id="account-action" type="button">sign in</button></div>
        <label class="row" id="auto-sync-row" hidden><span>auto sync</span><input type="checkbox" class="switch" id="autoSync"></label>
        <p class="row note" id="sync-note"></p>
      </div>
      <div class="group">
        <p class="row note">plugins</p>
        <p class="row note">coming soon.</p>
      </div>
      <div class="done"><button class="capsule small" value="done">done</button></div>
    </form>
  </dialog>

  <dialog class="settings account" id="account" aria-labelledby="account-title">
    <form id="account-form" novalidate>
      <h2 id="account-title">sign in</h2>
      <div class="fields">
        <div class="field">
          <input type="text" id="username" placeholder="username" aria-label="username" autocomplete="username" spellcheck="false" autocapitalize="off" maxlength="20">
          <svg class="field-mark" id="username-mark" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" hidden></svg>
        </div>
        <p class="hint" id="username-hint" aria-live="polite"></p>
        <input type="password" id="password" placeholder="password" aria-label="password" autocomplete="current-password">
        <input type="password" id="confirm" placeholder="confirm password" aria-label="confirm password" autocomplete="new-password" hidden>
        <p class="hint" id="confirm-hint" aria-live="polite" hidden></p>
      </div>
      <label class="stay"><span>stay signed in</span><input type="checkbox" class="switch" id="stay" checked></label>
      <p class="message" id="account-error" aria-live="polite"></p>
      <div class="account-actions">
        <button class="link" id="account-switch" type="button">new here?</button>
        <span class="spacer"></span>
        <button class="link" type="button" data-close>cancel</button>
        <button class="capsule small" id="account-submit" type="submit" disabled>sign in</button>
      </div>
    </form>
  </dialog>

  <dialog class="settings account" id="unsynced" aria-label="unsynced sessions">
    <form method="dialog">
      <p class="ask">you have unsynced sessions — sign out anyway?</p>
      <div class="account-actions">
        <span class="spacer"></span>
        <button class="link" value="cancel">cancel</button>
        <button class="capsule small" value="sign-out">sign out</button>
      </div>
    </form>
  </dialog>

  <dialog class="settings inspo" id="inspo">
    <form method="dialog">
      <div class="inspo-head">
        <h2>inspo</h2>
        <button class="link" type="button" data-page="today" aria-pressed="true">today</button>
        <button class="link" type="button" data-page="all" aria-pressed="false">all</button>
      </div>
      <div id="inspo-all" hidden>
        <div class="squares" id="inspo-squares"></div>
        <p class="watched" id="inspo-count"></p>
      </div>
      <ul id="inspo-list"></ul>
      <div class="done"><button class="capsule small" value="done">done</button></div>
    </form>
  </dialog>

  <dialog class="palette" id="palette" aria-label="commands">
    <input type="text" placeholder="type a command…" aria-label="command" role="combobox"
           aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list"
           autocomplete="off" spellcheck="false" autocapitalize="off">
    <ul id="palette-list" role="listbox" aria-label="commands"></ul>
  </dialog>
</body>
</html>
