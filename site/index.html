<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tetodoro</title>
  <meta name="description" content="a quiet pomodoro timer">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#F2F0ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mmerioles.github.io/tetodoro/">
  <meta property="og:title" content="tetodoro">
  <meta property="og:description" content="a quiet pomodoro timer">
  <meta property="og:image" content="https://mmerioles.github.io/tetodoro/light-running.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --paper: #F2F0ED;
      --ink: #2B2A2F;
      --faint: rgba(43, 42, 47, .5);
      --ghost: rgba(43, 42, 47, .12);
      --accent: #CF3A4F;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121211;
        --ink: #F1F0EB;
        --faint: rgba(241, 240, 235, .5);
        --ghost: rgba(241, 240, 235, .12);
        --accent: #F1F0EB;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 72px 16px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .icon { width: 96px; height: 96px; }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -.01em; margin-top: 18px; }
    .tagline { color: var(--faint); margin-top: 4px; }
    .download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 14px 40px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .download:hover { opacity: .86; }
    .download:active { transform: scale(.97); }
    .meta { color: var(--faint); font-size: 13px; margin-top: 12px; }
    .download svg { width: 18px; height: 18px; fill: currentColor; }
    .other { margin-top: 14px; display: inline-flex; padding: 6px; }
    .other svg { width: 16px; height: 16px; fill: currentColor; }
    /* Each logo shows only where it belongs. */
    .android .mac, body:not(.android) .android-only { display: none; }
    .shot {
      width: 100%;
      max-width: 780px;
      margin-top: 56px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .14));
    }
    .phone {
      display: none;
      width: 100%;
      max-width: 300px;
      margin-top: 48px;
      border-radius: 28px;
      box-shadow: 0 0 0 1px var(--ghost), 0 20px 40px rgba(0, 0, 0, .14);
    }
    /* On android, the phone shot stands in for the mac one. */
    .android .phone { display: block; }
    .android picture { display: none; }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      width: 100%;
      max-width: 720px;
      margin-top: 64px;
      list-style: none;
      padding: 0;
      text-align: left;
    }
    .features b { display: block; font-weight: 600; }
    .features span { color: var(--faint); font-size: 14px; }
    @media (max-width: 600px) {
      .features { grid-template-columns: 1fr; gap: 20px; }
    }
    footer { margin-top: 28px; font-size: 13px; display: flex; gap: 20px; }
    a.link { color: var(--faint); text-decoration: none; }
    a.link:hover { color: var(--ink); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>

    <img class="icon" src="icon.png" alt="">
    <h1>tetodoro</h1>
    <p class="tagline">a quiet pomodoro timer</p>

    <picture>
      <source srcset="dark.png" media="(prefers-color-scheme: dark)">
      <img class="shot" src="light-running.png" alt="tetodoro">
    </picture>
    <img class="phone" src="android.png" alt="tetodoro on android" loading="lazy">

    <ul class="features">
      <li><b>focus, then rest</b><span>a pomodoro timer that starts your breaks for you.</span></li>
      <li><b>tag what you study</b><span>see a year of focus time, per subject.</span></li>
      <li><b>always in reach</b><span id="reach">the countdown lives in your menu bar.</span></li>
    </ul>

    <footer>
      <a class="link" href="https://github.com/mmerioles/tetodoro">github</a>
      <a class="link" href="https://github.com/mmerioles/tetodoro/releases">releases</a>
    </footer>
  </main>

  <script>
    // One page for both apps. Android phones get the apk, everyone else the
    // dmg; #android or #mac in the address picks one by hand. The button
    // points straight at the newest release's file. If the API is
    // unreachable, it still links to the latest release page.
    const PLATFORMS = {
      mac: { ext: ".dmg", other: "android", reach: "the countdown lives in your menu bar." },
      android: { ext: ".apk", other: "mac", reach: "the countdown lives in your notifications." },
    };
    const $ = (id) => document.getElementById(id);
    const isAndroid = /android/i.test(navigator.userAgent);
    let release = null;

    function platform() {
      const hash = location.hash.slice(1);
      return PLATFORMS[hash] ? hash : isAndroid ? "android" : "mac";
    }

    function render() {
      const name = platform(), p = PLATFORMS[name];
      document.body.classList.toggle("android", name === "android");
      $("reach").textContent = p.reach;
      $("other").href = `#${p.other}`;
      $("other").setAttribute("aria-label", `get it for ${p.other}`);
      $("download").setAttribute("aria-label", `download for ${name}`);
      const file = release?.assets.find((a) => a.name.endsWith(p.ext));
      $("download").href = file?.browser_download_url ??
        "https://github.com/mmerioles/tetodoro/releases/latest";
      $("meta").textContent = file ? release.tag_name : "\u00a0";
    }

    addEventListener("hashchange", render);
    render();
    fetch("https://api.github.com/repos/mmerioles/tetodoro/releases/latest")
      .then((r) => r.ok ? r.json() : Promise.reject())
      .then((r) => { release = r; render(); })
      .catch(() => {});
  </script>
</body>
</html>
