# On every push to main: pick the next semantic version from commit messages
# (scripts/next-version.sh), build the mac, android and windows apps with it,
# and publish them all as GitHub release v<version>:
#   drill_<version>.dmg         universal mac app
#   drill_<version>.apk         android app, signed with the release key
#   drill_<version>_x64.exe     windows installer, intel and amd PCs
#   drill_<version>_arm64.exe   windows installer, arm PCs (snapdragon)
# The android key lives in repo secrets (see android/README.md). Every release
# has to be signed with the same key, or phones refuse the update.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "web/**"
      - "android/README.md"
      - "mac/README.md"
      - "ios/**"
      - "windows/README.md"
      - ".github/workflows/windows.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, for versioning
      - name: Version
        id: version
        run: echo "value=$(scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    if: needs.version.outputs.value != ''
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build app
        env:
          VERSION: ${{ needs.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: scripts/bundle.sh

      - name: Build dmg
        id: dmg
        run: echo "path=$(scripts/dmg.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: mac/${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.value != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't set. See android/README.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build apk
        working-directory: android
        env:
          VERSION: ${{ needs.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          mkdir -p ../build
          cp app/build/outputs/apk/release/app-release.apk "../build/drill_$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/drill_*.apk
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.value != ''
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test windows/Drill.Core.Tests -c Release

      - name: Publish app
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: >
          dotnet publish windows/Drill/Drill.csproj -c Release -r win-${{ matrix.arch }}
          --self-contained -p:Version=$env:VERSION -p:PublishReadyToRun=true
          -o build/windows/${{ matrix.arch }}

      - name: Build installer
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Q "/DVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" `
            "/DSource=$PWD\build\windows\${{ matrix.arch }}" "/DOutputDir=$PWD\build" `
            windows\installer\drill.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: build/drill_*_${{ matrix.arch }}.exe
          if-no-files-found: error

  publish:
    needs: [version, mac, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
