# Publishes web/site/ to GitHub Pages, with the web app under try/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/site/**"
      - "web/static/**"
      - "docs/icon.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble
        run: |
          mkdir -p _site
          cp -R web/site/. _site/
          cp docs/icon.png docs/screenshots/*.png _site/
          cp -R web/static _site/try
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
