# Publishes site/ to GitHub Pages. The download button looks up the newest
# release at page load, so the site doesn't need redeploying per release.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/icon.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp docs/icon.png docs/screenshots/*.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
